<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" font-family="Helvetica,Arial,sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2547">How a HELOC turns equity into an available line</text>

  <!-- boxes -->
  <g>
    <rect x="20" y="112" width="124" height="78" rx="12" fill="#eaf2fd" stroke="#cfe0fb"/>
    <text x="82" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">Home</text>
    <text x="82" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">equity</text>

    <rect x="167" y="112" width="124" height="78" rx="12" fill="#eaf2fd" stroke="#cfe0fb"/>
    <text x="229" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">Available</text>
    <text x="229" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">credit line</text>

    <rect x="314" y="112" width="124" height="78" rx="12" fill="#eaf2fd" stroke="#cfe0fb"/>
    <text x="376" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">Draw</text>
    <text x="376" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">period</text>

    <rect x="461" y="112" width="124" height="78" rx="12" fill="#eaf2fd" stroke="#cfe0fb"/>
    <text x="523" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">Borrow as</text>
    <text x="523" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">needed</text>

    <rect x="608" y="112" width="124" height="78" rx="12" fill="#eaf2fd" stroke="#cfe0fb"/>
    <text x="670" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16345f">Payments</text>

    <rect x="755" y="112" width="124" height="78" rx="12" fill="#0f2547"/>
    <text x="817" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Repayment</text>
    <text x="817" y="166" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">period</text>
  </g>

  <!-- arrows -->
  <g fill="#1d6fe0">
    <path d="M148 151 l10 -7 v14 z"/><path d="M295 151 l10 -7 v14 z"/>
    <path d="M442 151 l10 -7 v14 z"/><path d="M589 151 l10 -7 v14 z"/>
