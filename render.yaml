services:
  - type: web
    name: myfloridaequity
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PUBLIC_BASE_URL
        value: https://myfloridaequity.com
      - key: META_ROBOTS
        value: index, follow
